apiVersion: apps/v1
kind: Deployment
metadata:
  name: two-application
  labels:
    app: two-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: two-app
  template:
    metadata:
      labels:
        app: two-app
    spec:
      containers:
        - name: nginx
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
            
---
apiVersion: v1
kind: Service
metadata:
  name: two-app-service
spec:
  selector:
    app: two-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: two-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: two-app-service
                port:
                  number: 80
